spring.application.name=url-shortener
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Base URL (default for local development)
app.base-url=http://localhost:8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
# Explicit connection/command bounds; a timed-out write still has an uncertain outcome.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=1s

# Draft pipeline: do not enable ingestion until migration, reads and retention are verified.
app.analytics.pipeline.enabled=false
app.analytics.ingestion.enabled=false
app.analytics.consumer.enabled=false
app.analytics.reads.enabled=false
app.analytics.fresh-start=true
app.analytics.visitor-key=${ANALYTICS_VISITOR_KEY:}

# Database Connection Pool (High-Density Clustering)
# Set to 2 per node to ensure 3 replicas (6 total) fit within Azure's 10-connection limit
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
# PostgreSQL driver values are seconds. These also bound commit/network waits.
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1

logging.level.com.shunyalink=INFO
# Plain-text logs (local, tests) show each line's request ID; the container's JSON logs carry it as a field.
logging.pattern.correlation=[%X{requestId:-}]
spring.jpa.open-in-view=false

# Java 21 virtual threads for request handling and @Scheduled jobs: requests mostly wait (Sydney database,
# Redis, AI and CP-platform calls), and a waiting virtual thread holds no OS thread. With this, the 2-connection
# Hikari pool, not the thread count, is what limits concurrent database work (ADR 0021).
spring.threads.virtual.enabled=true

# Deadline for each competitive-programming platform when building a portfolio; a slower one is left out.
app.portfolio.platform-timeout=5s

# Dates as ISO-8601 text ("2026-11-20T09:08:07Z"), never numbers. Jackson 3 (Spring Boot 4) moved these from
# SerializationFeature to DateTimeFeature; its defaults agree, but the API contract is stated, not inherited.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.datatype.datetime.write-date-timestamps-as-nanoseconds=false

app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Secrets — deliberately no defaults: the app must refuse to start without them
# rather than silently sign tokens / encrypt data with a key published in this repo.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Legacy AES/ECB key: only read to migrate old link passwords to AES-GCM (LinkPasswordBackfill)
app.encryption.secret=${ENCRYPTION_SECRET}
# AES-256-GCM key for link passwords: base64 of exactly 32 random bytes (openssl rand -base64 32)
app.link-password.key=${LINK_PASSWORD_KEY}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:520225938600-lci1t3a5eb08udd6qgup6qcqa6vv7cbr.apps.googleusercontent.com}

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.shunyalink@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway configuration
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Actuator Monitoring
management.endpoints.web.exposure.include=health,info
# Public endpoint: per-component UP/DOWN (the UI status widget uses it), but never details
# such as database version, disk paths or validation queries.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
# The mail indicator opens an SMTP connection on every check, and the UI polls health
management.health.mail.enabled=false
# Public /actuator/info publishes only the deployed commit (baked into the image by CI), so the
# deploy pipeline can prove the new build is the one serving traffic. The repo is public anyway.
management.info.env.enabled=true
info.app.commit=${APP_COMMIT:unknown}

# AI providers (phishing check, link titles, CP roast). Providers retire models on their own schedule, so the
# model IDs are settings: when one is retired, change the Azure app setting instead of shipping code.
# The phishing-check outcome metric (shunyalink.phishing.checks{outcome=unavailable}) shows when neither works.
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.groq.api-key=${GROQ_API_KEY}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
# Google Safe Browsing (3.4b). Optional: without a key the check is off and only the AI check runs.
app.safe-browsing.api-key=${SAFE_BROWSING_API_KEY:}

# Multipart File Upload Limits (Profile Picture Uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Upper bound for ?size= on paged endpoints (default 2000). 200 is the most the dashboard asks for (3.8c).
spring.data.web.pageable.max-page-size=200

# Times are Instants in the code and UTC wall-clock time in the database, whatever the JVM's zone (3.10).
# The columns stay `timestamp` (no zone), as production has always written them, so an older build can still
# start against this schema (ddl-auto=validate) and a rollback stays possible. timestamptz comes with Phase 4.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
