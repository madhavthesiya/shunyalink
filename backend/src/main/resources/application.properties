spring.application.name=url-shortener
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Base URL (default for local development)
app.base-url=http://localhost:8080

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.redis.host=localhost
spring.data.redis.port=6379
# Explicit connection/command bounds; a timed-out write still has an uncertain outcome.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=1s

# Draft pipeline: do not enable ingestion until migration, reads and retention are verified.
app.analytics.pipeline.enabled=false
app.analytics.ingestion.enabled=false
app.analytics.consumer.enabled=false
app.analytics.reads.enabled=false
app.analytics.fresh-start=true
app.analytics.visitor-key=${ANALYTICS_VISITOR_KEY:}

# Database Connection Pool (High-Density Clustering)
# Set to 2 per node to ensure 3 replicas (6 total) fit within Azure's 10-connection limit
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
# PostgreSQL driver values are seconds. These also bound commit/network waits.
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1

logging.level.com.shunyalink=INFO
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Secrets — deliberately no defaults: the app must refuse to start without them
# rather than silently sign tokens / encrypt data with a key published in this repo.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Legacy AES/ECB key: only read to migrate old link passwords to AES-GCM (LinkPasswordBackfill)
app.encryption.secret=${ENCRYPTION_SECRET}
# AES-256-GCM key for link passwords: base64 of exactly 32 random bytes (openssl rand -base64 32)
app.link-password.key=${LINK_PASSWORD_KEY}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:520225938600-lci1t3a5eb08udd6qgup6qcqa6vv7cbr.apps.googleusercontent.com}

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.shunyalink@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway configuration
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Actuator Monitoring
management.endpoints.web.exposure.include=health,info
# Public endpoint: per-component UP/DOWN (the UI status widget uses it), but never details
# such as database version, disk paths or validation queries.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
# The mail indicator opens an SMTP connection on every check, and the UI polls health
management.health.mail.enabled=false
# Public /actuator/info publishes only the deployed commit (baked into the image by CI), so the
# deploy pipeline can prove the new build is the one serving traffic. The repo is public anyway.
management.info.env.enabled=true
info.app.commit=${APP_COMMIT:unknown}

# Gemini AI Integration
app.gemini.api-key=${GEMINI_API_KEY}

# Groq AI Integration
app.groq.api-key=${GROQ_API_KEY}

# Multipart File Upload Limits (Profile Picture Uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
